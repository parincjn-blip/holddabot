server {
    listen 165.245.178.197:443 ssl;
    server_name bot.hold-bet.com;
    ssl_certificate /etc/letsencrypt/live/bot.hold-bet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.hold-bet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    location = /auth/discord/callback {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
        # An upstream-connect error must not log the query containing the OAuth code.
        error_log /dev/null crit;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Do not persist OAuth codes, session-related queries or private request URLs.
        access_log off;
    }
}
